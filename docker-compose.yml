# Environnement de test Kode Agri : PostgreSQL + Odoo 19.
# Usage : ./scripts/install.sh   (voir docs/INSTALLATION.md)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - kode-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 3s
      timeout: 3s
      retries: 20

  odoo:
    image: odoo:19.0          # vérifier que cette étiquette existe sur le registre ; sinon : odoo:latest
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
    volumes:
      - ./addons:/mnt/extra-addons:ro
      - ./config/odoo.conf:/etc/odoo/odoo.conf:ro
      - kode-data:/var/lib/odoo

volumes:
  kode-db:
  kode-data:
